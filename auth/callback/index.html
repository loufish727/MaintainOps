<!doctype html>
<html lang="en">
  <head>

    <title>Verifying MaintainOps</title>
    <link rel="stylesheet" href="../../styles.css?v=auth-callback-1">
  </head>

    <main id="app" class="app">
      <section class="auth-shell">
        <div class="auth-card">
          <div class="brand-row">
            <span class="brand-mark">MO</span>

      </section>
    </main>
