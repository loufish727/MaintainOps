name: Resource Load Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  resource-load-smoke:
    name: Hosted resource-load smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run hosted resource-load smoke
        run: npx playwright test tests/smoke/resource-load.spec.js -g "serves required app resources"

      - name: Run local app-shell smoke
        run: |
          node scripts/local-static-server.js 4195 &
          MAINTAINOPS_BASE_URL="http://127.0.0.1:4195/" npx playwright test tests/smoke/resource-load.spec.js -g "renders the app shell"
