name: MaintainOps CI Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed

jobs:
  strict_lfes:
    if: github.event_name != 'workflow_run'
    name: Strict LFES
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run strict LFES
        run: npm run test:lfes:strict

      - name: Verify generated bundles are committed
        shell: bash
        run: |
          generated_changes="$(git status --porcelain --untracked-files=all -- index.html performance-spatial.html src/bundles)"
          if [[ -n "$generated_changes" ]]; then
            echo "::error::Strict LFES rebuilt browser bundles that are not committed. Run npm run build:runtime:bundles and commit the generated files."
            printf '%s\n' "$generated_changes"
            exit 1
          fi

  hosted-resource-load-smoke:
    needs: strict_lfes
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' &&
          needs.strict_lfes.result == 'success') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main')
      )
    name: Hosted App Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run hosted resource-load smoke
        run: npx playwright test tests/smoke/resource-load.spec.js --workers=1
        env:
          MAINTAINOPS_BASE_URL: https://loufish727.github.io/MaintainOps/
