name: Resource Load Smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed

jobs:
  checkout_resource_load_smoke:
    if: github.event_name != 'workflow_run'
    name: Checkout resource-load smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run checkout resource-load smoke
        run: |
          node scripts/local-static-server.js 4195 &
          MAINTAINOPS_BASE_URL="http://127.0.0.1:4195/" npx playwright test tests/smoke/resource-load.spec.js tests/smoke/platform-performance-mobile-browser.spec.js

  hosted-resource-load-smoke:
    needs: checkout_resource_load_smoke
    if: >-
      always() &&
      (
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.checkout_resource_load_smoke.result == 'success') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success')
      )
    name: Hosted resource-load smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run hosted resource-load smoke
        run: npx playwright test tests/smoke/resource-load.spec.js
