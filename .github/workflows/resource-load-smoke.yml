name: Resource Load Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  resource-load-smoke:
    name: Hosted resource-load smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run resource-load smoke
        run: npm run test:smoke:resources
